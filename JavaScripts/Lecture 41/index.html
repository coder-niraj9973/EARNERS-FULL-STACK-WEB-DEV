<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Hello Doston</h1>

    <form action="" id="form">
        <div>
            <label for="username">Name: </label>
            <input type="text" id="username" placeholder="Enter your username">
            <span class="error-message" style="color: red;"></span>
        </div>
        <div>
            <label for="email">email: </label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error-message" style="color: red;"></span>
        </div>
        <div>
            <label for="password">password: </label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error-message" style="color: red;"></span>
        </div>

        <p id="password-hint" class="hidden">Must be atleast 8 characters</p>


        <div>
            <label for="bio">bio: </label>
            <textarea type="bio" id="bio" placeholder="Enter your bio..."></textarea>
            <p id="char-count"></p>
            <span class="error-message" style="color: red;"></span>
        </div>

        <div>
            <label for="country">Select Your country</label>
            <select name="country" id="country">
                <option value="india">india</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
            </select>
            <span class="error-message" style="color: red;"></span>
        </div>

        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox" placeholder="">agree to the Terms & Conditions</label>
        </div>

        <button type="submit" id="btn">Create Account</button>
    </form>

    <h2 class="hidden">account created successfully</h2>

    <script src="script.js"></script>
</body>

</html>
