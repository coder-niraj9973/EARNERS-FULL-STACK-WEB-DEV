<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Forms</h1>
    <div>
        <form action="welcomePage.html" target="_blank">

            <fieldset>
                <legend>Enter your Information</legend>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter your name"><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email"><br><br>
                <label for="pass">Password: </label>
                <input type="password" id="pass" placeholder="Enter your password"><br><br>
                <label for="checkbox">Are you 18+ ?: </label>
                <input type="checkbox" id="checkbox" placeholder="Enter your password"><br><br>
                <label for="number">Enter your Phone: </label>
                <input type="number" id="num" placeholder="Enter your password"><br><br>
                <label for="gender">Gender: </label>
                <input type="radio" id="gender" name="gender">Male
                <input type="radio" id="gender" name="gender">Female<br><br>


                <br><br>
                <label for="date">Enter your DOB:</label>
                <input type="date" id="date">

                <br><br>
                <label for="file">Upload file: </label>
                <input type="file" id="file">


                <br><br>
                <label for="city">Select your city: </label>
                <select name="city" id="city">
                    <option value="">Delhi</option>
                    <option value="">Mumbai</option>
                    <option value="">Noida</option>
                    <option value="">HZB</option>
                </select>



                <textarea name="" id="">jdfvhbgjsd</textarea>

                <br> <br>
                <button>Submit your Form</button>

            </fieldset>
        </form>
    </div>
</body>

</html>
